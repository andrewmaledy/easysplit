{% extends "base.html" %}
{% block title %}Select a Trip — EasySplit{% endblock %}

{% block content %}
<div class="section">
    <div class="section-header"><h2>Multiple Trips Found</h2></div>
    <p style="color:var(--text-dim);font-size:0.875rem;margin-bottom:20px;">Several trips share that password. Which one do you want to open?</p>
    <div class="card">
        {% for p in projects %}
        <form method="POST" action="{{ url_for('select_project', project_id=p.id) }}" style="margin-bottom:10px;">
            <button type="submit" class="btn-secondary" style="width:100%;text-align:left;display:flex;align-items:center;gap:10px;">
                <span style="font-weight:600;">{{ p.name }}</span>
                <span class="pill" style="margin-left:auto;">ID {{ p.id }}</span>
            </button>
        </form>
        {% endfor %}
    </div>
    <p style="margin-top:16px;"><a href="{{ url_for('home') }}" class="btn btn-secondary">Back</a></p>
</div>
{% endblock %}
